---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production-sunsilk
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-sunsilk
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-sunsilk-secret
              key: api-token
        selector:
          dnsZones:
            - "sunsilk.id.vn"
