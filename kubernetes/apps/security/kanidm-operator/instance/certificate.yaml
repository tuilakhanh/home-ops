apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idm-tuilakhanh-id-vn
spec:
  dnsNames:
    - idm.tuilakhanh.id.vn
  duration: 160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: idm-tuilakhanh-id-vn-tls
  usages:
    - digital signature
