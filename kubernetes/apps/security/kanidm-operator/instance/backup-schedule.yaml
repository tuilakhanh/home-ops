---
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupSchedule
metadata:
  name: sso
spec:
  jitterSeconds: 300
  kanidmRef:
    name: sso
  localVersions: 7
  repositoryRef:
    name: nas
  retention:
    keepLast: 8
    daily: 7
    weekly: 4
    monthly: 6
    minAge: 24h
  schedule: 30 2 * * *
  timeZone: Asia/Ho_Chi_Minh
