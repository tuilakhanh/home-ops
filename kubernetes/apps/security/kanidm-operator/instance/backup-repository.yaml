apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: nas
spec:
  authentication:
    deleter:
      secretRef:
        name: kanidm-backup-secret
    reader:
      secretRef:
        name: kanidm-backup-secret
    writer:
      secretRef:
        name: kanidm-backup-secret
  encryption:
    mode: clientSide
    keyRef:
      name: kanidm-backup-secret
  s3:
    bucket: kanidm
    endpoint: https://81e69641b977773fe31b62d05f0b44e3.r2.cloudflarestorage.com
    forcePathStyle: true
    prefix: sso
    region: auto
