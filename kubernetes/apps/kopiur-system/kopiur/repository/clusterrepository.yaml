---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: cloudflare
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: cloudflare-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: ${AWS_ENDPOINT}
      region: auto
  encryption:
    passwordSecretRef:
      name: cloudflare-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: Asia/Ho_Chi_Minh
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: nas-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: 192.168.1.36:3900
      region: auto
  encryption:
    passwordSecretRef:
      name: nas-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: Asia/Ho_Chi_Minh