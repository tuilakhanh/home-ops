---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          # Kopiur 0.9.2 reads status.resolved from the parent Restore before
          # patching its status, but the chart only grants restores/status.
          - patch: |-
              - op: add
                path: /rules/-
                value:
                  apiGroups:
                    - kopiur.home-operations.com
                  resources:
                    - restores
                  verbs:
                    - get
            target:
              group: rbac.authorization.k8s.io
              kind: ClusterRole
              name: kopiur-mover
              version: v1
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
