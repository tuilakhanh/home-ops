---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sws
spec:
  chartRef:
    kind: OCIRepository
    name: sws
  interval: 1h
  values:
    networkpolicies:
      atuin:
        type: cilium
        controller: atuin
        forceRename: sws-external-ingress
        ingress:
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: network
              gateway.networking.k8s.io/gateway-name: envoy-external
          toPorts:
          - ports:
            - port: '8080'
              protocol: TCP
    controllers:
      atuin:
        containers:
          app:
            image:
              repository: ghcr.io/static-web-server/static-web-server
              tag: 2.44.1-alpine@sha256:40a63df84ab29401354968ff482178acc48ed20f2ac6b8b80dea1a4119d1f076
            env:
              SERVER_ROOT: /data
              SERVER_PORT: &port 8080
              SERVER_DIRECTORY_LISTING: "true"
              SERVER_CORS_ALLOW_ORIGINS: "*"
              SERVER_SECURITY_HEADERS: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 56Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.tuilakhanh.id.vn"
        parentRefs:
          - name: envoy-external
            namespace: network
      install:
        hostnames:
          - cliproxy.sunsilk.id.vn
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /install
    persistence:
      file:
        type: nfs
        server: 192.168.1.36
        path: /mnt/disk/files
        globalMounts:
          - path: /data
      install:
        type: configMap
        name: sws-install
        globalMounts:
          - path: /data/install
            subPath: install
