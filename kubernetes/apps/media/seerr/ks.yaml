---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
spec:
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/kopiur/legacy-pvc
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/seerr/app
  postBuild:
    substitute:
      APP: seerr
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: seerr
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: true
