---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shoko
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shoko
  values:
    controllers:
      shoko:
        initContainers:
          # v6 writes plugin thumbnails next to the plugin DLLs.
          plugins:
            image:
              repository: ghcr.io/shokoanime/server
              tag: daily@sha256:afc14ead16ef5f7d710c27d10247146d19b9067d9977c24944de529f0e0df823
            command:
              - "cp"
              - "-r"
              - "/usr/src/app/build/plugins/."
              - "/plugins/"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/shokoanime/server
              tag: daily@sha256:afc14ead16ef5f7d710c27d10247146d19b9067d9977c24944de529f0e0df823
            command:
              - "/usr/src/app/build/Shoko.CLI"
            env:
              PUID: "1000"
              PGID: "1000"
              SHOKO_HOME: /.shoko/Shoko.CLI
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 700Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 8111

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.tuilakhanh.id.vn"

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          shoko:
            app:
              - path: /.shoko

      metadata:
        accessMode: ReadWriteOnce
        size: 20Gi
        suffix: metadata
        storageClass: miroir-local
        globalMounts:
          - path: /.shoko/Shoko.CLI/images

      plugins:
        type: emptyDir
        advancedMounts:
          shoko:
            plugins:
              - path: /plugins
            app:
              - path: /usr/src/app/build/plugins

      drive:
        type: nfs
        server: 192.168.1.36
        path: /mnt/disk
        globalMounts:
          - path: /mount/disk/
