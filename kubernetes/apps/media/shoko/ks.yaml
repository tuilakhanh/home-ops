---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shoko
spec:
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/kopiur/legacy-pvc
    - ../../../../components/zeroscaler
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/media/shoko/app
  postBuild:
    substitute:
      APP: shoko
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
      KOPIUR_CAPACITY: 1Gi
      CONTROLLER: StatefulSet
      ZEROSCALER_TARGET: shoko
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: shoko
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
