---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
      ref:
        tag: 3.7.2
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "tuilakhanh.id.vn"
    ttl: 1
    image:
      repository: ghcr.io/k8s-gateway/k8s_gateway
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: 192.168.1.101
      externalTrafficPolicy: Cluster
    watchedResources:
      - "HTTPRoute"
      - "Service"
