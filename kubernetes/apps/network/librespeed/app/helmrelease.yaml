---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: librespeed
  values:
    controllers:
      librespeed:
        initContainers:
          copy-apache-config:
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: 6.3.0-alpine@sha256:6ac033cd117bff1b0158cf702c6cafcff31a84d7e3dd812421306ed0c8fd8b5a
            command:
              - /bin/sh
              - -c
              - cp -r /etc/apache2/. /config/
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: 6.3.0-alpine@sha256:6ac033cd117bff1b0158cf702c6cafcff31a84d7e3dd812421306ed0c8fd8b5a
            env:
              MODE: standalone
              TELEMETRY: "false"
              USE_NEW_DESIGN: "true"
              WEBPORT: &port 8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.tuilakhanh.id.vn"
        parentRefs:
          - name: envoy-external
            namespace: network
      upload:
        hostnames:
          - "{{ .Release.Name }}.tuilakhanh.id.vn"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /backend/empty.php
            backendRefs:
              - identifier: app
                port: http
    persistence:
      apache-config:
        type: emptyDir
        advancedMounts:
          librespeed:
            copy-apache-config:
              - path: /config
            app:
              - path: /etc/apache2
      runtime:
        type: emptyDir
        advancedMounts:
          librespeed:
            app:
              - path: /var/www/html
                subPath: html
              - path: /var/www/logs
                subPath: logs
              - path: /run/apache2
                subPath: run
              - path: /tmp
                subPath: tmp
