---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      ref:
        tag: 0.63.0
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false
