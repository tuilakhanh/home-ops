---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-artifacts
spec:
  dependsOn:
    - name: flux-instance
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-artifacts/app
  prune: true
  # Read Git directly so artifact generation can be repaired without source-watcher.
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  timeout: 5m
  wait: true
