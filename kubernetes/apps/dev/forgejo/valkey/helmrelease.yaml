---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
spec:
  chartRef:
    kind: OCIRepository
    name: valkey
  interval: 1h
  values:
    controllers:
      valkey:
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.1
            probes:
              liveness: &valkey-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - valkey-cli ping | grep PONG
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *valkey-probe
              startup: *valkey-probe
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 200Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        statefulset:
          volumeClaimTemplates:
            - name: valkey
              storageClass: miroir-local
              accessMode: ReadWriteOnce
              size: 1Gi
              advancedMounts:
                app:
                  - path: /data
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      valkey:
        controller: valkey
        forceRename: forgejo-valkey
        ports:
          redis:
            port: 6379
