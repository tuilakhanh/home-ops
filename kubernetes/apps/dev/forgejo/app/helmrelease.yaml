---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 30m
  dependsOn:
    - name: valkey
  values:
    gitea:
      admin:
        username: ""
      config:
        authorized_integration:
          ALLOW_LOCALNETWORKS: true
        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        lfs:
          PATH: /data/git/lfs
        mailer:
          ENABLED: false
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
        queue:
          TYPE: redis
          CONN_STR: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
        repository:
          DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.actions
          DISABLED_REPO_UNITS: repo.ext_wiki,repo.ext_issues
          ROOT: /data/git/repositories
        repository.pull-request:
          DEFAULT_MERGE_STYLE: squash
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /data/signing/ed25519.pub
          SIGNING_NAME: Forgejo Instance
          SIGNING_EMAIL: noreply@tuilakhanh.id.vn
          INITIAL_COMMIT: pubkey
          CRUD_ACTIONS: pubkey, parentsigned
          WIKI: never
          MERGES: pubkey
        security:
          LOGIN_REMEMBER_DAYS: 14
          REVERSE_PROXY_TRUSTED_PROXIES: 10.42.0.0/16
        server:
          APP_DATA_PATH: /data/gitea
          ROOT_URL: https://git.tuilakhanh.id.vn
          SSH_DOMAIN: git.tuilakhanh.id.vn
          SSH_PORT: &sshPort 22
          SSH_SERVER_HOST_KEYS: ssh/ssh_host_ed25519_key
          SSH_SERVER_USE_PROXY_PROTOCOL: true
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_ENABLE_TIMETRACKING: false
          ENABLE_INTERNAL_SIGNIN: true
          ENABLE_PASSWORD_SIGNIN_FORM: true
          SHOW_REGISTRATION_BUTTON: false
        service.explore:
          REQUIRE_SIGNIN_VIEW: false
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
          SESSION_LIFE_TIME: "1209600"
        webhook:
          ALLOWED_HOST_LIST: "*"
    extraContainerVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraInitVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraVolumes:
      - name: signing-key
        secret:
          secretName: forgejo-signing-key
          defaultMode: 0400
    httpRoute:
      enabled: false
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 17.0.1-rootless
    persistence:
      create: false
      claimName: forgejo
    service:
      ssh:
        port: *sshPort
    tcpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: ssh
        - name: envoy-external
          namespace: network
          sectionName: ssh-proxy
