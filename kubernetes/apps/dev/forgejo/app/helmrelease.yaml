---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://code.forgejo.org/forgejo-helm/forgejo
      ref:
        tag: 17.3.2
      interval: 1h
  interval: 30m
  dependsOn:
    - name: valkey
  # The Forgejo chart emits only a Deployment; retain its generated configuration.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: forgejo
            patch: |-
              - op: replace
                path: /kind
                value: StatefulSet
              - op: remove
                path: /spec/strategy
              - op: add
                path: /spec/serviceName
                value: forgejo-headless
              - op: add
                path: /spec/podManagementPolicy
                value: Parallel
              - op: add
                path: /spec/persistentVolumeClaimRetentionPolicy
                value:
                  whenDeleted: Retain
                  whenScaled: Retain
              - op: add
                path: /spec/volumeClaimTemplates
                value:
                  - metadata:
                      name: data
                    spec:
                      accessModes: [ReadWriteOnce]
                      storageClassName: miroir-local
                      resources:
                        requests:
                          storage: 10Gi
                      dataSourceRef:
                        apiGroup: kopiur.home-operations.com
                        kind: Restore
                        name: forgejo-statefulset
  values:
    gitea:
      admin:
        username: ""
      config:
        authorized_integration:
          ALLOW_LOCALNETWORKS: true
        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        lfs:
          PATH: /data/git/lfs
        mailer:
          ENABLED: false
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
        queue:
          TYPE: redis
          CONN_STR: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
        repository:
          DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.actions
          DISABLED_REPO_UNITS: repo.ext_wiki,repo.ext_issues
          ROOT: /data/git/repositories
        repository.pull-request:
          DEFAULT_MERGE_STYLE: squash
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /data/signing/ed25519.pub
          SIGNING_NAME: Forgejo Instance
          SIGNING_EMAIL: noreply@tuilakhanh.id.vn
          INITIAL_COMMIT: pubkey
          CRUD_ACTIONS: pubkey, parentsigned
          WIKI: never
          MERGES: pubkey
        security:
          LOGIN_REMEMBER_DAYS: 14
          REVERSE_PROXY_TRUSTED_PROXIES: 10.69.0.0/16
        server:
          APP_DATA_PATH: /data/gitea
          ROOT_URL: https://git.tuilakhanh.id.vn
          SSH_DOMAIN: git.tuilakhanh.id.vn
          SSH_PORT: &sshPort 22
          SSH_SERVER_HOST_KEYS: ssh/ssh_host_ed25519_key
          SSH_SERVER_USE_PROXY_PROTOCOL: true
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_ENABLE_TIMETRACKING: false
          ENABLE_INTERNAL_SIGNIN: false
          ENABLE_PASSWORD_SIGNIN_FORM: false
          SHOW_REGISTRATION_BUTTON: false
        service.explore:
          REQUIRE_SIGNIN_VIEW: false
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://forgejo-valkey:6379?pool_size=100&idle_timeout=180s
          SESSION_LIFE_TIME: "1209600"
        webhook:
          ALLOWED_HOST_LIST: "*"
      oauth:
        - name: kanidm
          adminGroup: forgejo_admins@idm.tuilakhanh.id.vn
          autoDiscoverUrl: https://idm.tuilakhanh.id.vn/oauth2/openid/forgejo/.well-known/openid-configuration
          existingSecret: forgejo-kanidm-oauth2-credentials
          groupClaimName: groups
          provider: openidConnect
          scopes: profile email groups
    extraContainerVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraInitVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraVolumes:
      - name: signing-key
        secret:
          secretName: forgejo-signing-key
          defaultMode: 0400
    httpRoute:
      enabled: false
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 17.0.2-rootless
    persistence:
      create: false
      mount: false
    extraDeploy:
      - apiVersion: v1
        kind: Service
        metadata:
          name: forgejo-headless
        spec:
          clusterIP: None
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/name: forgejo
            app.kubernetes.io/instance: forgejo
          ports:
            - name: http
              port: 3000
              targetPort: 3000
    service:
      ssh:
        port: *sshPort
    tcpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: ssh
        - name: envoy-external
          namespace: network
          sectionName: ssh-proxy
