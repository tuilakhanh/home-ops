---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cliproxyapi
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/ai/cliproxyapi/app
  postBuild:
    substitute:
      APP: cliproxyapi
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65534"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 10m
  wait: false
