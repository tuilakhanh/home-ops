---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sub2api
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    # networkpolicies:
    #   sub2api:
    #     type: cilium
    #     controller: sub2api
    #     forceRename: sub2api-external-ingress
    #     ingress:
    #       - fromEndpoints:
    #           - matchLabels:
    #               k8s:io.kubernetes.pod.namespace: network
    #               gateway.networking.k8s.io/gateway-name: envoy-external
    #         toPorts:
    #           - ports:
    #               - port: "8080"
    #                 protocol: TCP

    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      *app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/wei-shaw/sub2api
              tag: 0.2.20
            env:
              AUTO_SETUP: "true"
              SERVER_HOST: 0.0.0.0
              SERVER_PORT: &port 8080
              SERVER_MODE: release
              RUN_MODE: standard

              DATABASE_HOST: postgres-cluster-rw.database.svc.cluster.local
              DATABASE_PORT: 5432
              DATABASE_USER: *app
              DATABASE_DBNAME: *app
              DATABASE_SSLMODE: verify-full
              PGSSLROOTCERT: /var/run/secrets/postgresql/ca.crt
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key

              # The Valkey controller below is exposed as this service.
              REDIS_HOST: sub2api-valkey
              REDIS_PORT: 6379
              REDIS_DB: 0
              REDIS_ENABLE_TLS: "false"

            envFrom:
              - secretRef:
                  name: sub2api-secret
                  optional: true

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

      valkey:
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.1
            args:
              - valkey-server
              - --appendonly
              - "yes"
              - --appendfsync
              - everysec
            probes:
              liveness: &valkey-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - valkey-cli ping | grep PONG
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *valkey-probes
              startup: *valkey-probes
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: miroir-local
              accessMode: ReadWriteOnce
              size: 1Gi
              advancedMounts:
                app:
                  - path: /data

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      valkey:
        controller: valkey
        forceRename: sub2api-valkey
        ports:
          redis:
            port: 6379

    route:
      app:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - cliproxy.sunsilk.id.vn
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          sub2api:
            app:
              - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
