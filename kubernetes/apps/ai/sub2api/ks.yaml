---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sub2api
spec:
  components:
    - ../../../../components/cnpg/app-template
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: postgres-cluster
      namespace: database
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/ai/sub2api/app
  postBuild:
    substitute:
      APP: sub2api
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 10m
  wait: false
