---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1

  certificates:
    serverTLSSecret: postgres-server-cert
    serverCASecret: postgres-server-ca
    clientCASecret: postgres-client-root-ca
    replicationTLSSecret: postgres-client-cert

  storage:
    size: 10Gi
    storageClass: miroir-local
    
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 256MB
    pg_hba:
      - hostnossl all all 10.69.0.0/16      scram-sha-256
      - hostnossl all all fc69::/16         scram-sha-256
      - hostssl   all all all               cert clientcert=verify-full
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  
  monitoring:
    enablePodMonitor: false
  
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      hugepages-2Mi: 1Gi
      memory: 2Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-cluster
        serverName: postgres-cluster

  bootstrap:
    recovery:
      source: source

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-cluster
          serverName: postgres
