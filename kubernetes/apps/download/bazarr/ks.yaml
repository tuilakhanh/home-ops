---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
spec:
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/zeroscaler
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/download/bazarr/app
  postBuild:
    substitute:
      APP: bazarr
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
      KOPIUR_CAPACITY: 5Gi
      ZEROSCALER_TARGET: bazarr
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: bazarr
    namespace: flux-system
  targetNamespace: download
  timeout: 5m
  wait: false
