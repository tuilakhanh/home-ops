---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      recyclarr:
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
            env:
              CRON_SCHEDULE: "0 0 * * *"
              SONARR_ANIME_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-anime-secret
                    key: SONARR__AUTH__APIKEY
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
              RADARR_ANIME_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-anime-secret
                    key: RADARR__AUTH__APIKEY
              RECYCLARR_DATA_DIR:
                value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 36M
              limits:
                memory: 128M
        statefulset:
          podManagementPolicy: Parallel
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 512Mi
              storageClass: miroir-local
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: '{{ .Release.Name }}-statefulset'
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
      tmp:
        type: emptyDir
