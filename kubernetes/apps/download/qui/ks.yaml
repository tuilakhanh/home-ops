---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qui
spec:
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/zeroscaler
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/download/qui/app
  postBuild:
    substitute:
      APP: qui
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
      KOPIUR_CAPACITY: 2Gi
      ZEROSCALER_TARGET: qui
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: qui
    namespace: flux-system
  targetNamespace: download
  wait: false
