---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bazarr-anime
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bazarr-anime
  values:
    controllers:
      bazarr-anime:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          patch-upload-limits:
            image:
              repository: ghcr.io/lavx/bazarr
              tag: 2.6.2
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                sed 's/app = web.Application()/app = web.Application(client_max_size=32 * 1024 * 1024)/' \
                  /app/bazarr/docker/supervisor.py > /patch/supervisor.py
                sed 's/MAXIMUM_SUBTITLE_SIZE = 1 \* 1024 \* 1024/MAXIMUM_SUBTITLE_SIZE = 32 * 1024 * 1024/' \
                  /app/bazarr/bazarr/constants.py > /patch/constants.py
                grep -F 'client_max_size=32 * 1024 * 1024' /patch/supervisor.py
                grep -F 'MAXIMUM_SUBTITLE_SIZE = 32 * 1024 * 1024' /patch/constants.py
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/lavx/bazarr
              tag: 2.6.2
            command:
              - python
            args:
              - docker/supervisor.py
              - --no-update
              - --config
              - /config
            env:
              BAZARR__PORT: &port 6767
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 6767
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              # limits:
              #   memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.tuilakhanh.id.vn"
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      upload-limit-patch:
        type: emptyDir
        advancedMounts:
          bazarr-anime:
            patch-upload-limits:
              - path: /patch
            app:
              - path: /app/bazarr/docker/supervisor.py
                subPath: supervisor.py
                readOnly: true
              - path: /app/bazarr/bazarr/constants.py
                subPath: constants.py
                readOnly: true
      config:
        existingClaim: *app
      media:
        type: nfs
        server: 192.168.1.36
        path: /mnt/disk
        globalMounts:
          - path: /mnt/disk/
      tmp:
        type: emptyDir
