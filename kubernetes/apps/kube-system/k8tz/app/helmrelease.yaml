---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/k8tz/k8tz/charts/k8tz
      ref:
        tag: 0.22.0
  interval: 1h
  values:
    namespace: null
    createNamespace: false
    replicaCount: 1
    timezone: Asia/Ho_Chi_Minh
    cronJobTimeZone: true
    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-webhook-issuer
          kind: Issuer
